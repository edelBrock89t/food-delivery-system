spring.application.name=order-service
server.port=8083

#
# JDBC Properties
#
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

#
# Additional Hibernate Properties
#
spring.jpa.hibernate.ddl-auto=update

#
# Kafka Properties
#
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages='*'

#
# SSL Bundle Properties
#
spring.ssl.bundle.pem.payment-service-client.keystore.certificate=classpath:certificates/client-order.pem
spring.ssl.bundle.pem.payment-service-client.keystore.private-key=classpath:certificates/client-order-key.pem
spring.ssl.bundle.pem.payment-service-client.truststore.certificate=classpath:certificates/ca-cert.pem

#
# gRPC Client Properties
#
spring.grpc.client.channels.payment-service-client.address=localhost:7071
spring.grpc.client.channels.payment-service-client.negotiationType=TLS
spring.grpc.client.channels.payment-service-client.enableKeepAlive=true
spring.grpc.client.channels.payment-service-client.keepAliveWithoutCalls=true
spring.grpc.client.channels.payment-service-client.ssl.enabled=true
spring.grpc.client.channels.payment-service-client.ssl.bundle=payment-service-client

#
# Internal Project Properties
#
order.kafka.topics=orders.events
delivery.kafka.topic.delivery-assigned=delivery.events
